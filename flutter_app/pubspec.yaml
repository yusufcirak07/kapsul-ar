publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.2.0
  latlong2: ^0.9.1
  http: ^1.2.2
  geolocator: ^13.0.2
  sensors_plus: ^6.1.0
  shared_preferences: ^2.3.3
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
